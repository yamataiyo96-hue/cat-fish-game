<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ナマズ釣りゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #1a2a3a;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #1e3c72, #2a5298);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    #scoreboard {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 18px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
    }
    .score-title {
      font-size: 16px;
      font-weight: bold;
      color: #ffeb3b;
    }
    .score-value {
      font-size: 24px;
      font-weight: bold;
    }
    #leaderboard {
      position: absolute;
      top: 85px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px;
      border-radius: 12px;
      width: 180px;
      z-index: 10;
      font-size: 13px;
    }
    #leaderboard h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #00e676;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 4px;
    }
    .leader-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    #pond {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    /* 魚の見た目を絵文字（🐟）に変更 */
    .namazu {
      position: absolute;
      font-size: 60px;
      cursor: pointer;
      transition: transform 0.1s ease;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
      line-height: 1;
    }
    .namazu:active {
      transform: scale(1.2);
    }
    .ripple {
      position: absolute;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: ripple-effect 0.6s linear;
      pointer-events: none;
    }
    @keyframes ripple-effect {
      0% { width: 0; height: 0; opacity: 1; transform: translate(-50%, -50%); }
      100% { width: 80px; height: 80px; opacity: 0; transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="scoreboard">
      <div>
        <div class="score-title">あなたの釣果</div>
        <div class="score-value" id="my-score">0 匹</div>
      </div>
      <div>
        <div class="score-title">みんなの合計</div>
        <div class="score-value" id="global-score">0 匹</div>
      </div>
    </div>

    <div id="leaderboard">
      <h3>リアルタイム順位</h3>
      <div id="leaderboard-list">まだ記録がありません</div>
    </div>

    <div id="pond"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      limit, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBSkY3xAd071fz0Jn23Fz1COnUt51Xzebg",
      authDomain: "nnxe-29f42.firebaseapp.com",
      projectId: "nnxe-29f42",
      storageBucket: "nnxe-29f42.firebasestorage.app",
      messagingSenderId: "1048000668049",
      appId: "1:1048000668049:web:89d3eb41b9979c473f7a30",
      measurementId: "G-C7738KS76M"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let score = 0;
    const playerId = "プレイヤー_" + Math.floor(Math.random() * 8999 + 1000);

    const myScoreEl = document.getElementById('my-score');
    const globalScoreEl = document.getElementById('global-score');
    const leaderboardListEl = document.getElementById('leaderboard-list');
    const pond = document.getElementById('pond');

    // 1. リアルタイム受信
    const scoresQuery = query(collection(db, "catch_logs"), orderBy("timestamp", "desc"), limit(100));
    
    onSnapshot(scoresQuery, (snapshot) => {
      globalScoreEl.textContent = `${snapshot.size} 匹`;

      const playerTotals = {};
      snapshot.docs.forEach(doc => {
        const data = doc.data();
        if (data.playerId) {
          playerTotals[data.playerId] = (playerTotals[data.playerId] || 0) + 1;
        }
      });

      const sorted = Object.entries(playerTotals).sort((a, b) => b[1] - a[1]).slice(0, 5);
      
      if (sorted.length === 0) {
        leaderboardListEl.innerHTML = 'まだ記録がありません';
      } else {
        leaderboardListEl.innerHTML = sorted.map(([id, count], idx) => `
          <div class="leader-item">
            <span>${idx + 1}. ${id === playerId ? '★あなた' : id}</span>
            <span><b>${count}</b> 匹</span>
          </div>
        `).join('');
      }
    });

    // 2. 魚（絵文字 🐟）の出現とクリック処理
    function spawnNamazu() {
      const namazu = document.createElement('div');
      namazu.className = 'namazu';
      namazu.textContent = '🐟'; // 魚の絵文字を表示

      const maxX = pond.clientWidth - 80;
      const maxY = pond.clientHeight - 80;
      const x = Math.max(20, Math.floor(Math.random() * maxX));
      const y = Math.max(100, Math.floor(Math.random() * maxY));

      namazu.style.left = `${x}px`;
      namazu.style.top = `${y}px`;

      namazu.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        createRipple(e.clientX, e.clientY);
        
        score++;
        myScoreEl.textContent = `${score} 匹`;

        addDoc(collection(db, "catch_logs"), {
          playerId: playerId,
          timestamp: serverTimestamp()
        });

        namazu.remove();
        setTimeout(spawnNamazu, 600);
      });

      pond.appendChild(namazu);

      setTimeout(() => {
        if (namazu.parentElement) {
          namazu.remove();
          spawnNamazu();
        }
      }, 4000);
    }

    function createRipple(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    spawnNamazu();
    spawnNamazu();
  </script>
</body>
</html>
